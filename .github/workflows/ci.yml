name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # global.json pins 8.0.400 with rollForward latestFeature; any 8.0.x SDK >= 8.0.400 satisfies it.
          dotnet-version: 8.0.x
      - run: dotnet restore CaseAgents.sln
      - run: dotnet build CaseAgents.sln --no-restore -c Release
      # Cosmos integration tests skip themselves unless CASEAGENTS_COSMOS_TESTS=1.
      - run: dotnet test CaseAgents.sln --no-build -c Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - name: Check the seed script syntax
        working-directory: .
        run: node --check scripts/seed.mjs
