# Local Azure Cosmos DB emulator (Linux container) for the Cosmos storage mode and the Cosmos integration tests.
# Start: docker compose up -d   (first start takes 1-3 minutes; wait until the service is "healthy")
# Data Explorer: https://localhost:8081/_explorer/index.html (self-signed certificate)
# Host port 8081 taken by something else? Set COSMOS_EMULATOR_PORT (e.g. 18081) here, in the dev scripts' environment,
# and in the connection string (AccountEndpoint=https://localhost:18081/).
services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: caseagents-cosmos
    mem_limit: 3g
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: "5"
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "false"
      # Advertise localhost so clients on the host can follow the endpoints the emulator returns.
      AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE: "127.0.0.1"
    ports:
      - "${COSMOS_EMULATOR_PORT:-8081}:8081"
      - "10250-10255:10250-10255"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk https://localhost:8081/_explorer/emulator.pem > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
